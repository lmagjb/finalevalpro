<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvalPro - Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              depedBlue: "#0033A0",
              depedBg: "#F9F9F9",
              textMuted: "#4B5563",
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Inter", sans-serif; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    
    <!-- Simple Top Bar -->
    <nav class="bg-depedBlue text-white p-4 shadow-sm">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-4">
          <a href="teacher-dashboard.html" class="text-white hover:text-blue-200 transition-colors p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </a>
          <div>
            <h1 class="text-xl font-bold">EvalPro</h1>
            <p class="text-xs text-blue-200">Notifications</p>
          </div>
        </div>

        <div class="flex items-center gap-6">
          <button id="notification-btn" class="flex items-center gap-2 text-sm hover:text-blue-200 transition-colors relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            Notifications
            <span id="notification-badge" class="hidden absolute -top-1 -right-2 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] text-white">0</span>
          </button>
          
          <a href="teacher-profile.html" class="flex items-center gap-2 text-sm hover:text-blue-200 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Profile
          </a>
          
          <form action="/api/auth/logout" method="POST" class="inline">
            <button type="submit" class="flex items-center gap-2 text-sm hover:text-red-300 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              Logout
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto w-full p-6">
      
      <!-- Header -->
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-bold text-gray-900">Notifications</h2>
          <p class="text-sm text-textMuted mt-1">Stay updated on your promotion application status.</p>
        </div>
        <button id="mark-all-read-btn" onclick="markAllAsRead()" class="hidden px-4 py-2 bg-white border border-gray-300 rounded-md font-semibold text-sm text-gray-700 hover:bg-gray-50 transition-colors">
          Mark All as Read
        </button>
      </header>

      <!-- Notification Filters -->
      <div class="flex flex-wrap gap-2 mb-6 border-b border-gray-200 pb-1">
        <button onclick="filterNotifications('all')" class="filter-btn active px-4 py-2 rounded-md text-sm font-semibold border border-depedBlue bg-depedBlue text-white transition-colors">
          All
        </button>
        <button onclick="filterNotifications('unread')" class="filter-btn px-4 py-2 rounded-md text-sm font-semibold border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors">
          Unread
        </button>
        <button onclick="filterNotifications('stage')" class="filter-btn px-4 py-2 rounded-md text-sm font-semibold border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors">
          Stage Updates
        </button>
        <button onclick="filterNotifications('returned')" class="filter-btn px-4 py-2 rounded-md text-sm font-semibold border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors">
          Returned Documents
        </button>
      </div>

      <!-- Empty State -->
      <div id="notif-empty-state" class="bg-white border border-gray-300 rounded-md p-8 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <p class="text-base font-bold text-gray-500">You're all caught up!</p>
        <p class="text-sm text-textMuted mt-1">No new notifications at this time.</p>
      </div>

      <!-- Notifications List -->
      <div id="notifications-list" class="space-y-3 hidden">
        <!-- BACKEND DEV NOTE: Loop through database notifications and inject rows here. Example:
        <div class="notification-item unread bg-white border border-gray-300 rounded-md p-4 flex items-start gap-3 cursor-pointer hover:bg-gray-50 transition-colors" data-type="stage">
          <div class="w-2 h-2 rounded-full bg-depedBlue mt-2 flex-shrink-0"></div>
          <div class="flex-1">
            <h3 class="text-sm font-semibold text-gray-900">Your application has been endorsed to AO II</h3>
            <p class="text-xs text-textMuted mt-1">August 24, 2026</p>
          </div>
        </div>
        -->
      </div>

      <!-- Load More Button -->
      <div id="load-more-container" class="text-center mt-6 hidden">
        <button class="px-4 py-2 bg-white border border-gray-300 rounded-md font-semibold text-sm text-gray-700 hover:bg-gray-50 transition-colors">
          Load Older Notifications
        </button>
      </div>

    </main>

    <!-- JavaScript -->
    <script>
      // Notification dropdown logic
      const notifBtn = document.getElementById("notification-btn");
      const notifDropdown = document.getElementById("notification-dropdown");
      const closeDropdownBtn = document.getElementById("close-dropdown-btn");

      if (notifBtn && notifDropdown) {
        notifBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          notifDropdown.classList.toggle("hidden");
        });
        closeDropdownBtn.addEventListener("click", () => {
          notifDropdown.classList.add("hidden");
        });
        document.addEventListener("click", (e) => {
          if (!notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) {
            notifDropdown.classList.add("hidden");
          }
        });
      }

      // Filter notifications
      function filterNotifications(type) {
        const notifications = document.querySelectorAll(".notification-item");
        const filterBtns = document.querySelectorAll(".filter-btn");

        // Update active button
        filterBtns.forEach((btn) => {
          btn.classList.remove("active", "bg-depedBlue", "text-white", "border-depedBlue");
          btn.classList.add("border-gray-300", "text-gray-700");
        });
        event.target.classList.add("active", "bg-depedBlue", "text-white", "border-depedBlue");
        event.target.classList.remove("border-gray-300", "text-gray-700");

        // Filter logic
        notifications.forEach((notif) => {
          if (type === "all") {
            notif.style.display = "flex";
          } else if (type === "unread") {
            notif.style.display = notif.classList.contains("unread") ? "flex" : "none";
          } else if (type === "stage") {
            notif.style.display = notif.getAttribute("data-type") === "stage" ? "flex" : "none";
          } else if (type === "returned") {
            notif.style.display = notif.getAttribute("data-type") === "returned" ? "flex" : "none";
          }
        });
      }

      // Mark all as read
      function markAllAsRead() {
        const unreadNotifications = document.querySelectorAll(".notification-item.unread");
        unreadNotifications.forEach((notif) => {
          notif.classList.remove("unread", "bg-white", "border-depedBlue", "border-red-500", "border-yellow-500");
          notif.classList.add("read", "bg-gray-50", "border-gray-300");

          const dot = notif.querySelector(".rounded-full");
          if (dot) {
            dot.classList.remove("bg-depedBlue", "bg-red-500", "bg-yellow-500");
            dot.classList.add("bg-gray-400");
          }

          const title = notif.querySelector("h3");
          if (title) {
            title.classList.remove("text-gray-900");
            title.classList.add("text-textMuted");
          }
        });

        // Hide badge when marked as read
        const badge = document.getElementById("notification-badge");
        if (badge) badge.classList.add("hidden");

        const markAllBtn = document.getElementById("mark-all-read-btn");
        if (markAllBtn) markAllBtn.classList.add("hidden");
      }

      // Click notification to mark as read
      document.getElementById("notifications-list").addEventListener("click", function (e) {
        const notif = e.target.closest(".notification-item.unread");
        if (notif) {
          notif.classList.remove("unread", "bg-white");
          notif.classList.add("read", "bg-gray-50");

          const dot = notif.querySelector(".rounded-full");
          if (dot) {
            dot.classList.remove("bg-depedBlue", "bg-red-500", "bg-yellow-500");
            dot.classList.add("bg-gray-400");
          }

          const title = notif.querySelector("h3");
          if (title) {
            title.classList.remove("text-gray-900");
            title.classList.add("text-textMuted");
          }
        }
      });
    </script>
  </body>
</html>
