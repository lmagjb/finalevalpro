<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvalPro - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        depedBlue: '#0033A0',
                        depedBg: '#F9F9F9',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-depedBg min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[500px]">
        
        <!-- header -->
        <div class="text-center mb-8">
            <!-- sample logog for now -->
            <div class="inline-flex items-center justify-center w-20 h-20 bg-depedBlue rounded-2xl shadow-lg mb-4">
                <span class="text-white text-4xl font-extrabold">E</span>
            </div>
            <!-- app name-->
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">EvalPro</h1>
        </div>

        <!-- login card design -->
        <div class="bg-white rounded-2xl shadow-[0_10px_25px_-5px_rgba(0,0,0,0.05)] border border-gray-100 p-10">
            
            <h2 class="text-3xl font-extrabold text-gray-900 mb-8">Log in</h2>

            <form id="login-form" class="space-y-6">
                
                <!-- email add field -->
                <div>
                    <label for="email" class="block text-lg font-semibold text-gray-700 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full h-[60px] px-5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-depedBlue/20 focus:border-depedBlue outline-none transition-all text-lg text-gray-900 placeholder-gray-400" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- pass field -->
                <div>
                    <label for="password" class="block text-lg font-semibold text-gray-700 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="w-full h-[60px] px-5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-depedBlue/20 focus:border-depedBlue outline-none transition-all text-lg text-gray-900 placeholder-gray-400" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- forgot password  -->
                <div class="text-left -mt-2">
                    <a href="#" class="text-lg font-semibold text-depedBlue hover:text-blue-800 transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- login button -->
                <button 
                    type="submit" 
                    class="w-full h-[60px] bg-depedBlue text-white text-xl font-extrabold rounded-xl hover:bg-blue-800 transition-colors shadow-md flex items-center justify-center mt-8"
                >
                    Login
                </button>

            </form>
        </div>

    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Login button clicked! Redirecting to dashboard...');
        });
    </script>

</body>
</html>
