<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvalPro - HR Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { 
          extend: { 
            colors: { depedBlue: "#0033A0", textMuted: "#4B5563" }, 
            fontFamily: { sans: ["Inter", "sans-serif"] } 
          } 
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style> body { font-family: "Inter", sans-serif; } </style>
  </head>
  <body class="bg-white min-h-screen flex">
    
    <!-- welcome message left side -->
    <div class="hidden lg:flex lg:w-1/2 bg-depedBlue flex-col justify-between p-16 text-white relative overflow-hidden">
      <div class="absolute top-0 right-0 w-96 h-96 bg-white opacity-5 rounded-full -mr-32 -mt-32"></div>
      <div class="absolute bottom-0 left-0 w-64 h-64 bg-white opacity-5 rounded-full -ml-16 -mb-16"></div>
      <div class="relative z-10">
        <div class="flex items-center gap-3 mb-20">
          <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-depedBlue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
          </div>
          <h1 class="text-4xl font-extrabold tracking-tight">EvalPro</h1>
        </div>
        <h2 class="text-5xl font-extrabold leading-tight mb-6">Welcome to the HR Portal.</h2>
        <p class="text-xl text-blue-100 max-w-md leading-relaxed">Sign in to verify Qualification Standards, cross-check PDS, and process division records.</p>
      </div>
      
    </div>

    <!-- login form right side -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-10 lg:p-20 bg-white relative">
      
      <!-- dummy mobile logo -->
      <div class="lg:hidden absolute top-10 left-10 flex items-center gap-2">
        <div class="w-8 h-8 bg-depedBlue rounded-lg flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-depedBlue tracking-tight">EvalPro</h1>
      </div>

      <!-- go back to role selection -->
      <div class="w-full max-w-md mt-16 lg:mt-0">
        <a href="../index.html" class="inline-flex items-center gap-2 text-textMuted hover:text-depedBlue font-semibold mb-8 transition-colors group text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
          Back to Role Selection
        </a>
        
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Sign in</h2>
        <p class="text-lg text-textMuted mb-10">Enter your DepEd credentials to continue.</p>

        <!-- warning message invalid backend  -->
        <div id="login-error" style="display: none;" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm font-semibold items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <span>Invalid email or password. Please try again.</span>
        </div>

        <!-- backend -->
        <form id="login-form" class="space-y-5" action="/api/auth/login" method="POST">
          
          <!-- backend -->
          <input type="hidden" name="role" value="hr" />
          
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
            <input type="email" id="email" name="email" class="w-full h-[50px] px-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-depedBlue/20 focus:border-depedBlue outline-none transition-all text-base text-gray-900 placeholder-gray-400" placeholder="hr.ao2@deped.gov.ph" required />
          </div>
          
          <div>
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
            <input type="password" id="password" name="password" class="w-full h-[50px] px-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-depedBlue/20 focus:border-depedBlue outline-none transition-all text-base text-gray-900 placeholder-gray-400" placeholder="Enter your password" required />
            <div class="flex justify-end mt-1.5">
              <a href="#" class="text-sm font-semibold text-depedBlue hover:underline">Forgot password?</a>
            </div>
          </div>
          
          <!-- login button -->
          <button type="submit" class="w-full h-[50px] bg-depedBlue text-white text-base font-bold rounded-xl hover:bg-blue-800 transition-colors shadow-md flex items-center justify-center mt-6">
            Sign In
          </button>
        </form>
        
        

    <!-- backend "only for demo purposes" -->
    <script>
      document.getElementById("login-form").addEventListener("submit", function(e){
        e.preventDefault(); 
        window.location.href = "hr-dashboard.html";
      });
    </script>
  </body>
</html>
